<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>SnapCoat Voice AI — Orb Preview</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#06080f;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(130% 130% at 50% 42%, #0c1230 0%, #06080f 62%, #04050a 100%)}
  canvas{display:block;touch-action:none}
  .label{position:fixed;top:24px;left:0;right:0;text-align:center;color:#cbd5e1;
    font-size:13px;letter-spacing:3px;text-transform:uppercase;opacity:.7;pointer-events:none}
  .brand{font-weight:800;font-size:20px;letter-spacing:-.5px;
    background:linear-gradient(90deg,#3B82F6,#8B5CF6,#C026D3,#EC4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  #status{position:fixed;top:64%;left:0;right:0;text-align:center;color:#fff;font-size:19px;font-weight:700;pointer-events:none}
  #status .sub{margin-top:5px;font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.4)}
  #controls{position:fixed;top:74%;left:50%;transform:translateX(-50%);display:flex;gap:18px}
  .ctl{width:58px;height:58px;border-radius:999px;border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.05);color:#fff;font-size:22px;cursor:pointer;backdrop-filter:blur(8px);transition:all .2s}
  .ctl:hover{background:rgba(255,255,255,.10)}
  .ctl.live{border-color:#ec4899;background:rgba(236,72,153,.14);box-shadow:0 0 26px rgba(236,72,153,.35)}
  .ctl.end{background:#f43f5e;border-color:#f43f5e}
  #switch{position:fixed;bottom:42px;left:50%;transform:translateX(-50%);
    padding:11px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.05);color:rgba(255,255,255,.82);font-size:14px;font-weight:600;cursor:pointer;
    backdrop-filter:blur(8px);transition:all .2s;display:flex;align-items:center;gap:8px}
  #switch:hover{background:rgba(255,255,255,.10)}
  #hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#475569;font-size:11px;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div class="label"><div class="brand">SnapCoat</div>OwnerIQ Voice</div>
<div id="status">Listening…<div class="sub">OwnerIQ · alloy</div></div>
<div id="controls">
  <button class="ctl" id="mic" title="Mute">🎤</button>
  <button class="ctl end" title="End">⏹</button>
</div>
<button id="switch">💬 Switch to text</button>
<div id="hint">live mobile preview · tap 🎤 to drive the orb with your voice</div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H,CX,CY,R,DPR=Math.min(window.devicePixelRatio||1,2);
function resize(){
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2; CY=H*0.40; R=Math.min(W,H)*0.27;
}
window.addEventListener('resize',resize); resize();

const BRAND=[[37,99,235],[59,130,246],[139,92,246],[192,38,211],[236,72,153]];
const lerp=(a,b,t)=>a+(b-a)*t;
function brandColor(t){t=Math.max(0,Math.min(.9999,t));const f=t*(BRAND.length-1),i=Math.floor(f),k=f-i,a=BRAND[i],b=BRAND[i+1];
  return [Math.round(lerp(a[0],b[0],k)),Math.round(lerp(a[1],b[1],k)),Math.round(lerp(a[2],b[2],k))];}

const LAT=34,LON=64,verts=[];
for(let i=0;i<=LAT;i++)for(let j=0;j<LON;j++)verts.push({lat:i/LAT*Math.PI,lon:j/LON*Math.PI*2});
const parts=[];for(let i=0;i<260;i++){const a=Math.random()*6.28,rad=1.05+Math.random()*.55,y=(Math.random()-.5)*2.1;
  parts.push({a,rad,y,sp:.0008+Math.random()*.0018,ph:Math.random()*6.28,sz:Math.random()*2+.5});}
function noise(la,lo,t){return Math.sin(la*3+t*1.1)*.5+Math.sin(lo*4-t*1.3)*.5+Math.sin((la+lo)*2+t*.7)*.4;}
function project(x,y,z){const p=900/(900+z);return [CX+x*p,CY+y*p,p];}

// --- audio ---
let analyser=null,freq=null,micLevel=0;
const micBtn=document.getElementById('mic');
micBtn.onclick=async()=>{
  if(analyser){return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaStreamSource(stream);
    analyser=ac.createAnalyser(); analyser.fftSize=512; analyser.smoothingTimeConstant=.8;
    freq=new Uint8Array(analyser.frequencyBinCount); src.connect(analyser);
    micBtn.classList.add('live'); micBtn.textContent='🎙️';
    document.getElementById('hint').textContent='reacting to your mic in real time';
  }catch(e){ micBtn.textContent='🚫'; }
};
function readLevel(t){
  if(analyser){
    analyser.getByteFrequencyData(freq);
    let s=0;for(let i=0;i<freq.length;i++)s+=freq[i];
    micLevel=lerp(micLevel, Math.min(1,(s/freq.length)/110), .35);
    return micLevel;
  }
  const a=Math.max(0,.45*Math.pow(Math.abs(Math.sin(t*2.1)),.6)+.35*Math.pow(Math.abs(Math.sin(t*5.3+1)),.8)+.20*Math.abs(Math.sin(t*9.7+2)));
  return Math.min(1,a);
}

let t=0;
function frame(){
  t+=0.016; const level=readLevel(t);
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  const bloom=ctx.createRadialGradient(CX,CY,0,CX,CY,R*(1.5+level*.5));
  bloom.addColorStop(0,`rgba(139,92,246,${.15+level*.22})`);
  bloom.addColorStop(.5,`rgba(99,102,241,${.05+level*.10})`);
  bloom.addColorStop(1,'rgba(6,8,15,0)');
  ctx.fillStyle=bloom; ctx.fillRect(0,0,W,H);

  const rotY=t*.25,rotX=Math.sin(t*.18)*.25,cyv=Math.cos(rotX),syv=Math.sin(rotX),czv=Math.cos(rotY),szv=Math.sin(rotY);
  const P=new Array(verts.length);
  for(let v=0;v<verts.length;v++){
    const {lat,lon}=verts[v];
    const breathe=1+level*.20+Math.sin(t*1.6)*.012;
    const ripple=1+(.035+level*.13)*noise(lat,lon,t)+level*.045*Math.sin(lon*7+t*5.5);
    const r=R*breathe*ripple;
    let x=r*Math.sin(lat)*Math.cos(lon),y=r*Math.cos(lat),z=r*Math.sin(lat)*Math.sin(lon);
    let x1=x*czv-z*szv,z1=x*szv+z*czv,y2=y*cyv-z1*syv,z2=y*syv+z1*cyv;
    const pr=project(x1,y2,z2); P[v]={x:pr[0],y:pr[1],persp:pr[2],lat,z:z2};
  }
  const idx=(i,j)=>i*LON+(j%LON);
  // Batch each latitude ring into ONE path (~35 strokes/frame instead of ~4500), no per-line
  // shadowBlur. Glow = a wide faint pass + a thin bright pass under additive 'lighter' blend.
  ctx.lineCap='round';
  for(let i=0;i<=LAT;i++){
    const c=brandColor(i/LAT*.85+.05);
    const path=new Path2D();
    for(let j=0;j<LON;j++){
      const a=P[idx(i,j)], e=P[idx(i,j+1)];
      path.moveTo(a.x,a.y); path.lineTo(e.x,e.y);                         // around the ring
      if(i<LAT){ const b=P[idx(i+1,j)]; path.moveTo(a.x,a.y); path.lineTo(b.x,b.y); } // down to next ring
    }
    ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},${.08+level*.10})`; ctx.lineWidth=3.0; ctx.stroke(path); // glow
    ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},${.42+level*.40})`; ctx.lineWidth=1.0; ctx.stroke(path); // core
  }
  for(let v=0;v<P.length;v++){const a=P[v];if(a.persp<.92)continue;const c=brandColor(a.lat/Math.PI*.85+.05);
    ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${.5*level+.15})`;ctx.beginPath();ctx.arc(a.x,a.y,1.1+level*1.6,0,6.28);ctx.fill();}
  for(const p of parts){
    p.a+=p.sp*(1+level*2);
    const x=Math.cos(p.a)*p.rad*R,z=Math.sin(p.a)*p.rad*R,y=p.y*R+Math.sin(t*.6+p.ph)*10;
    let x1=x*czv-z*szv,z1=x*szv+z*czv,y2=y*cyv-z1*syv,z2=y*syv+z1*cyv;
    const pr=project(x1,y2,z2),c=brandColor((p.y/2)+.5),tw=.4+.6*Math.abs(Math.sin(t*2+p.ph));
    ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${(.2+level*.5)*tw*pr[2]})`;
    ctx.beginPath();ctx.arc(pr[0],pr[1],p.sz*pr[2]*(1+level*.5),0,6.28);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
